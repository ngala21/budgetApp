<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Budget Calculator</title>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <h1>Budget Calculator</h1>
        <div class="sub-container">
          <!-- Salary Row -->
          <div class="total-amount-container">
            <h2>Salary</h2>
            <input
              type="number"
              id="totalAmount"
              placeholder="enter your salary"
            />
            <p class="hide error" id="salaryError">
              Value cannot be empty or negative
            </p>
            <button class="submit" id="totalAmountBtn">Save Salary</button>
          </div>

          <!-- Expenditure Row -->
          <div class="user-amount-comtainer">
            <h2>Expenses</h2>
            <p class="hide error" id="productTitleError">
              Value cannot be empty
            </p>
            <input
              type="text"
              class="product-title"
              id="productTitle"
              placeholder="enter expense name"
            />
            <input
              type="number"
              id="userAmount"
              placeholder="enter expense amount"
            />
            <button class="submit" id="checkAmount">Save Expense</button>
          </div>
        </div>
      </div>

      <!-- Output -->
      <div class="output-container flex-space">
        <div>
          <p>Total Budget</p>
          <span id="amount">0</span>
        </div>
        <div>
          <p>Expenses</p>
          <span id="expenditureValue">0</span>
        </div>
        <div>
          <p>Balance</p>
          <span id="balanceAmount">0</span>
        </div>
      </div>

      <!-- Expenses List -->
      <div class="list">
        <h3>Expense List</h3>
        <div class="list-container" id="expenseList"></div>
      </div>
    </div>

    <script src="./js/app.js" type="text/JavaScript" defer></script>
  </body>
</html>
