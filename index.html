<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Budget Calculator</title>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="sub-container">
          <h1>KshFlow</h1>
          <p>
            A smart financial dashboard that tracks your spending habits in
            real-time, giving you a live reality check on your hustle from
            Spendthrift to Financial Guru.
          </p>
          <!-- Budget -->
          <div class="total-amount-container">
            <h3>Salary</h3>
            <p class="hide error" id="budget-error">
              Value cannot be empty or negative
            </p>
            <input
              type="number"
              id="total-amount"
              placeholder="Enter Salary Amount"
            />
            <button class="submit" id="total-amount-button">Save Salary</button>
          </div>
          <!-- Expenditure -->
          <div class="user-amount-container">
            <h3>Expenses</h3>
            <p class="hide error" id="product-title-error">
              Values cannot be empty
            </p>
            <input
              type="text"
              class="product-title"
              id="product-title"
              placeholder="Enter Expense Name"
            />
            <input
              type="number"
              id="user-amount"
              placeholder="Enter Expense Amount"
            />
            <button class="submit" id="check-amount">Save Expense</button>
          </div>
        </div>
        <!-- Output -->
        <div class="output-container flex-space">
          <div>
            <p>Salary</p>
            <span id="amount">0</span>
          </div>
          <div>
            <p>Expenses</p>
            <span id="expenditure-value">0</span>
          </div>
          <div>
            <p>Balance</p>
            <span id="balance-amount">0</span>
          </div>
        </div>
      </div>

      <!-- Financial Personality -->
      <div class="habit-container">
        <h4 id="habit-message"></h4>
      </div>

      <!-- List -->
      <div class="list">
        <div class="flex-space">
          <h3>Expense List</h3>
          <button id="clear-all" class="clear-btn">Clear All</button>
        </div>
        <div class="list-container" id="list"></div>
      </div>
    </div>

    <script src="./js/app.js" type="text/JavaScript" defer></script>
  </body>
</html>
